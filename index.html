<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Prediction Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .balance { color: #ffd700; font-weight: bold; font-size: 18px; }
        .timer-box { font-size: 24px; font-weight: bold; margin: 20px 0; color: #00bcd4; }
        .btn-container { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .btn {
            border: none; padding: 15px 30px; font-size: 18px; font-weight: bold;
            border-radius: 8px; cursor: pointer; color: white; width: 120px;
        }
        .btn-red { background-color: #f44336; box-shadow: 0 4px #b71c1c; }
        .btn-green { background-color: #4CAF50; box-shadow: 0 4px #1b5e20; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        #ad-space {
            margin-top: 30px; padding: 15px; background: #2c2c2c;
            border-radius: 5px; color: #888; font-size: 14px;
        }
        #message { margin-top: 15px; font-size: 16px; height: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <span>ID: <span id="userId">User</span></span>
        <span class="balance">🪙 <span id="balance">1000</span></span>
    </div>

    <div class="timer-box">Time Left: <span id="timer">30</span>s</div>
    
    <div id="message">Place your bet! (Amount: 100 🪙)</div>

    <div class="btn-container">
        <button class="btn btn-red" onclick="placeBet('red')">RED</button>
        <button class="btn btn-green" onclick="placeBet('green')">GREEN</button>
    </div>

    <!-- Banner Ad Placeholder (AdMob / Unity Ads / AppLovin MAX) -->
    <div id="ad-space">
        [Ad Mediation Banner Area - 320x50]
    </div>

    <script>
        // Telegram Web App Initialize
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        
        // Aapka Live Backend URL
        const BACKEND_URL = "https://game-backend-1-fgug.onrender.com";
        
        // Telegram se User ka data lena (agar available ho)
        const user = window.Telegram.WebApp.initDataUnsafe?.user;
        const telegramId = user ? user.id : "guest_123";
        document.getElementById("userId").innerText = user ? user.first_name : "Guest";

        let countdown = 30;
        let isBetPlaced = false;

        // Timer Logic
        setInterval(() => {
            countdown--;
            document.getElementById("timer").innerText = countdown;
            
            if (countdown <= 0) {
                countdown = 30;
                isBetPlaced = false;
                document.getElementById("message").innerText = "New round started! Place your bet.";
                document.getElementById("message").style.color = "#ffffff";
                // Yahan aap result check karne ke liye server ko call kar sakte hain
            }
        }, 1000);

        // Bet Lagane ka function
        async function placeBet(color) {
            if (isBetPlaced) {
                alert("Bet already placed for this round!");
                return;
            }

            // Haptic Feedback
            window.Telegram.WebApp.HapticFeedback.impactOccurred("medium");
            
            document.getElementById("message").innerText = `Bet placed on ${color.toUpperCase()}! Waiting for result...`;
            document.getElementById("message").style.color = "#00bcd4";
            isBetPlaced = true;

            try {
                // Server ko bet bhejna
                const response = await fetch(`${BACKEND_URL}/bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegramId: telegramId,
                        betColor: color,
                        betAmount: 100
                    })
                });

                const data = await response.json();
                console.log("Server Response:", data);
                
                // Agar balance update karna ho
                if(data.newBalance) {
                    document.getElementById("balance").innerText = data.newBalance;
                }

            } catch (error) {
                console.error("Server connection error:", error);
                document.getElementById("message").innerText = "Failed to connect to server.";
                document.getElementById("message").style.color = "#f44336";
                isBetPlaced = false; // Error aane par wapas bet lagane dein
            }
        }
    </script>
</body>
</html>
