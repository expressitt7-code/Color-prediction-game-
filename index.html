
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Color Prediction Game</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 10px; margin: 0; }
        .btn { padding: 15px 20px; margin: 5px; border: none; border-radius: 8px; font-size: 16px; color: white; cursor: pointer; font-weight: bold; width: 30%; transition: 0.2s;}
        .btn:active { transform: scale(0.95); }
        .red { background: #f44336; }
        .green { background: #4caf50; }
        .violet { background: #9c27b0; }
        #timer { font-size: 45px; font-weight: bold; color: #ffeb3b; margin: 15px 0; }
        #period { color: #00bcd4; }
        .history-box { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <h2>Period: <span id="period">Loading...</span></h2>
    <div id="timer">--</div>
    
    <h3>Place Your Bet (₹10)</h3>
    <div>
        <button class="btn green" onclick="placeBet('Green')">Green</button>
        <button class="btn violet" onclick="placeBet('Violet')">Violet</button>
        <button class="btn red" onclick="placeBet('Red')">Red</button>
    </div>

    <div class="history-box">
        <h3 style="text-align: center; margin-top: 0; color: #bbb;">Game History</h3>
        <ul id="history" style="list-style: none; padding: 0;"></ul>
    </div>

    <script>
        // Telegram UI Setup
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // Aapka Live Render Backend Link
        const BACKEND_URL = "https://game-backend-1-fgug.onrender.com";

        function fetchGameStatus() {
            fetch(`${BACKEND_URL}/game-status`)
                .then(res => res.json())
                .then(data => {
                    // UI mein Period aur Timer update karna
                    document.getElementById("period").innerText = data.period;
                    document.getElementById("timer").innerText = data.time + "s";
                    
                    // History Update karna
                    let historyHTML = "";
                    data.results.forEach(res => {
                        historyHTML += `<li style="padding: 8px 0; border-bottom: 1px solid #333; font-size: 15px;">
                            Period ${res.period}: <b style="color:${res.color.toLowerCase()}">${res.color}</b> (Number: ${res.number})
                        </li>`;
                    });
                    document.getElementById("history").innerHTML = historyHTML;
                })
                .catch(err => console.log("Server issue: ", err));
        }

        function placeBet(color) {
            // Telegram app mein vibrate karwana
            window.Telegram.WebApp.HapticFeedback.impactOccurred("medium");
            
            fetch(`${BACKEND_URL}/place-bet`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ amount: 10, selection: color })
            })
            .then(res => res.json())
            .then(data => {
                alert(`✅ Bet Placed on ${color}!`);
            });
        }

        // Har 1 second mein server se naya time mangwana
        setInterval(fetchGameStatus, 1000);
        fetchGameStatus();
    </script>
</body>
</html>
