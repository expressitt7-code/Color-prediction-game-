<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Prediction UI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f9; margin: 0; padding: 0; color: #333; }
        
        /* Header */
        .header { background-color: #ff4747; color: white; padding: 15px; display: flex; justify-content: space-between; font-weight: bold; }

        /* Timer Card */
        .timer-card { background: linear-gradient(135deg, #ff6b6b, #ff4747); margin: 15px; border-radius: 15px; padding: 15px; color: white; display: flex; justify-content: space-between; box-shadow: 0 4px 10px rgba(255, 71, 71, 0.3); }
        .timer-left .title { font-size: 14px; margin-bottom: 5px; opacity: 0.9; }
        .timer-left .subtitle { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .history-balls { display: flex; gap: 5px; }
        .history-balls .ball { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; }
        .timer-right { text-align: right; border-left: 1px dashed rgba(255,255,255,0.5); padding-left: 15px; }
        .digital-clock { display: flex; gap: 5px; justify-content: flex-end; margin-bottom: 5px; }
        .digital-clock span { background: white; color: #ff4747; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 18px; }
        
        /* Main Game Area */
        .game-area { background: white; margin: 0 15px 15px 15px; border-radius: 15px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        /* Color Buttons */
        .color-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-color { flex: 1; padding: 12px 0; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-green { background-color: #4CAF50; } .btn-violet { background-color: #9C27B0; } .btn-red { background-color: #F44336; }

        /* Number Grid */
        .number-grid { background: #f0f0f0; padding: 15px; border-radius: 10px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px 10px; margin-bottom: 20px; }
        .num-ball { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; margin: auto; cursor: pointer; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.2); }
        .n-green { background: #4CAF50; color: white; } .n-red { background: #F44336; color: white; }
        .n-violet-red { background: linear-gradient(to right, #9C27B0 50%, #F44336 50%); color: white; }
        .n-violet-green { background: linear-gradient(to right, #9C27B0 50%, #4CAF50 50%); color: white; }

        /* Big Small Buttons */
        .size-row { display: flex; gap: 10px; }
        .btn-size { flex: 1; padding: 15px 0; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 18px; cursor: pointer; }
        .btn-big { background-color: #ff9800; } .btn-small { background-color: #2196F3; }

        /* --- NEW: Popup Styling --- */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10; }
        .bet-popup { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; z-index: 20; box-shadow: 0 -5px 15px rgba(0,0,0,0.2); }
        .popup-header { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #333; }
        .amount-row { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; }
        .btn-amt { padding: 12px 18px; border: 2px solid #eee; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; font-size: 16px; color: #333; }
        .btn-amt.active { background: #4CAF50; color: white; border-color: #4CAF50; }
        .btn-confirm { width: 100%; padding: 15px; background: #ff4747; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <span>&lt; Back</span>
        <span>Win Go</span>
        <span>₹<span id="balance-display">5000</span></span>
    </div>

    <!-- Timer Card -->
    <div class="timer-card">
        <div class="timer-left">
            <div class="title">🏆 How to play</div>
            <div class="subtitle">Win Go 1Min</div>
            <div class="history-balls">
                <div class="ball btn-green">7</div>
                <div class="ball btn-green">3</div>
                <div class="ball btn-red">8</div>
            </div>
        </div>
        <div class="timer-right">
            <div style="font-size: 14px; margin-bottom: 5px;">Time remaining</div>
            <div class="digital-clock">
                <span>0</span><span>0</span>:
                <span id="sec1">0</span><span id="sec2">0</span>
            </div>
            <div style="font-size: 12px;" id="period-num">20240213010418</div>
        </div>
    </div>

    <!-- Main Game Area -->
    <div class="game-area">
        <div class="color-row">
            <button class="btn-color btn-green" onclick="openPopup('Green')">Green</button>
            <button class="btn-color btn-violet" onclick="openPopup('Violet')">Violet</button>
            <button class="btn-color btn-red" onclick="openPopup('Red')">Red</button>
        </div>

        <div class="number-grid">
            <div class="num-ball n-violet-red" onclick="openPopup('Number 0')">0</div>
            <div class="num-ball n-green" onclick="openPopup('Number 1')">1</div>
            <div class="num-ball n-red" onclick="openPopup('Number 2')">2</div>
            <div class="num-ball n-green" onclick="openPopup('Number 3')">3</div>
            <div class="num-ball n-red" onclick="openPopup('Number 4')">4</div>
            <div class="num-ball n-violet-green" onclick="openPopup('Number 5')">5</div>
            <div class="num-ball n-red" onclick="openPopup('Number 6')">6</div>
            <div class="num-ball n-green" onclick="openPopup('Number 7')">7</div>
            <div class="num-ball n-red" onclick="openPopup('Number 8')">8</div>
            <div class="num-ball n-green" onclick="openPopup('Number 9')">9</div>
        </div>

        <div class="size-row">
            <button class="btn-size btn-big" onclick="openPopup('Big')">Big</button>
            <button class="btn-size btn-small" onclick="openPopup('Small')">Small</button>
        </div>
    </div>

    <!-- --- NEW: Popup HTML --- -->
    <div class="overlay" id="overlay" onclick="closePopup()"></div>
    <div class="bet-popup" id="betPopup">
        <div class="popup-header">
            <span id="betTitle">Select Amount</span>
            <span onclick="closePopup()" style="color: #999; cursor: pointer; padding: 0 10px;">✖</span>
        </div>
        <div class="amount-row">
            <button class="btn-amt active" onclick="setAmount(10, this)">₹10</button>
            <button class="btn-amt" onclick="setAmount(50, this)">₹50</button>
            <button class="btn-amt" onclick="setAmount(100, this)">₹100</button>
            <button class="btn-amt" onclick="setAmount(500, this)">₹500</button>
            <button class="btn-amt" onclick="setAmount(1000, this)">₹1000</button>
        </div>
        <button class="btn-confirm" onclick="confirmBet()">CONFIRM BET</button>
    </div>

    <script>
        if(window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Live Timer
        let timeLeft = 60;
        let periodId = 20240213010418;
        setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) { timeLeft = 59; periodId++; document.getElementById('period-num').innerText = periodId; }
            let secString = timeLeft < 10 ? "0" + timeLeft : timeLeft.toString();
            document.getElementById('sec1').innerText = secString.charAt(0);
            document.getElementById('sec2').innerText = secString.charAt(1);
        }, 1000);

        // --- NEW: Betting Popup Logic ---
        let balance = 5000;
        let currentSelection = "";
        let currentAmount = 10;

        function openPopup(option) {
            currentSelection = option;
            document.getElementById('betTitle').innerText = "Bet on: " + option;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('betPopup').style.display = 'block';
            if(window.Telegram && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred("light");
            }
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('betPopup').style.display = 'none';
        }

        function setAmount(amt, element) {
            currentAmount = amt;
            let btns = document.querySelectorAll('.btn-amt');
            btns.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            if(window.Telegram && window.Telegram.WebApp.HapticFeedback) window.Telegram.WebApp.HapticFeedback.selectionChanged();
        }

        function confirmBet() {
            if (balance >= currentAmount) {
                balance -= currentAmount; // Paise deduct karo
                document.getElementById('balance-display').innerText = balance; // Naya balance top pe dikhao
                closePopup();
                
                // Show success notification in Telegram
                if(window.Telegram && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
                }
                
                alert(`Successfully placed ₹${currentAmount} on ${currentSelection}!`);
                
            } else {
                alert("Insufficient Balance!");
                if(window.Telegram && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred("error");
                }
            }
        }
    </script>
</body>
</html>
