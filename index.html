<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Prediction Game</title>
    
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin-bottom: 10px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .balance-text { color: #ffd700; font-weight: bold; }
        .timer-box {
            font-size: 20px;
            font-weight: bold;
            color: #00bcd4;
            margin-bottom: 20px;
        }
        #result-box {
            width: 150px;
            height: 150px;
            background-color: #333;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: background-color 0.5s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #status { font-size: 16px; margin-bottom: 20px; height: 25px; color: #aaaaaa; }
        .btn-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .btn {
            border: none; padding: 15px 30px; font-size: 20px; font-weight: bold;
            border-radius: 10px; cursor: pointer; color: white; width: 130px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-red { background-color: #f44336; box-shadow: 0 5px #b71c1c; }
        .btn-green { background-color: #4CAF50; box-shadow: 0 5px #1b5e20; }
        #history-container {
            background: #1e1e1e; padding: 15px; border-radius: 10px;
            width: 100%; max-width: 400px; box-sizing: border-box; margin-bottom: 15px;
        }
        .history-dots {
            display: flex; justify-content: center; gap: 10px; margin-top: 10px; height: 30px;
        }
        .dot { width: 25px; height: 25px; border-radius: 50%; }
        .dot-red { background-color: #f44336; }
        .dot-green { background-color: #4CAF50; }
        #ad-space {
            width: 100%; max-width: 400px; padding: 10px; background: #2c2c2c;
            border-radius: 5px; color: #888; font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="header">
        <span>ID: <span id="userId">User</span></span>
        <span class="balance-text">🪙 <span id="balance">1000</span></span>
    </div>

    <div class="timer-box">Time Left: <span id="timer">30</span>s</div>

    <div id="result-box">?</div>
    <div id="status">Select Red or Green (Bet: 100 🪙)</div>

    <div class="btn-container">
        <button class="btn btn-red" onclick="playGame('red')">RED</button>
        <button class="btn btn-green" onclick="playGame('green')">GREEN</button>
    </div>

    <div id="history-container">
        <div>Recent Results</div>
        <div class="history-dots" id="history">
            <!-- Puraane results yahan dikhenge -->
        </div>
    </div>

    <!-- Banner Ad Placeholder -->
    <div id="ad-space">Ad Space (320x50)</div>

    <script>
        // Telegram Web App API initialization
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); 

        // Aapka Live Backend URL
        const BACKEND_URL = "https://game-backend-1-fgug.onrender.com";

        // User ID Telegram se nikalna
        const user = window.Telegram.WebApp.initDataUnsafe?.user;
        const telegramId = user ? user.id : "guest_123";
        document.getElementById("userId").innerText = user ? user.first_name : "Guest";

        let countdown = 30;
        let isBetPlaced = false;
        let history = [];

        // Timer Logic
        setInterval(() => {
            countdown--;
            document.getElementById("timer").innerText = countdown;
            
            if (countdown <= 0) {
                countdown = 30;
                isBetPlaced = false;
                document.getElementById("status").innerText = "New round started! Place your bet.";
                document.getElementById("status").style.color = "#aaaaaa";
                document.getElementById("result-box").innerText = "?";
                document.getElementById("result-box").style.backgroundColor = "#333";
            }
        }, 1000);

        function updateHistory(color) {
            history.push(color);
            if (history.length > 7) history.shift();
            
            let historyHtml = "";
            history.forEach(c => {
                historyHtml += `<div class="dot dot-${c}"></div>`;
            });
            document.getElementById("history").innerHTML = historyHtml;
        }

        async function playGame(userChoice) {
            if (isBetPlaced) {
                alert("Bet already placed for this round! Wait for the timer.");
                return;
            }
            
            let resultBox = document.getElementById("result-box");
            let statusText = document.getElementById("status");
            isBetPlaced = true;
            
            // Animation start
            statusText.innerText = "Placing bet on Server...";
            statusText.style.color = "#ffffff";
            resultBox.innerText = "🔄";
            resultBox.style.backgroundColor = "#555";
            window.Telegram.WebApp.HapticFeedback.impactOccurred("medium");

            try {
                // Server ko data bhejna
                const response = await fetch(`${BACKEND_URL}/bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegramId: telegramId,
                        betColor: userChoice,
                        betAmount: 100
                    })
                });

                const data = await response.json();
                
                // Server se success aane par UI update
                statusText.innerText = `Bet Placed on ${userChoice.toUpperCase()}!`;
                statusText.style.color = "#00bcd4";
                
                if(data.newBalance) {
                    document.getElementById("balance").innerText = data.newBalance;
                }

                // Temporary visual result for the old design feel 
                // (Isey hum aage server ke result se replace karenge)
                setTimeout(() => {
                    let tempResult = Math.random() > 0.5 ? 'green' : 'red';
                    resultBox.innerText = "";
                    resultBox.style.backgroundColor = tempResult === 'red' ? "#f44336" : "#4CAF50";
                    updateHistory(tempResult);
                }, 1000);

            } catch (error) {
                console.error(error);
                statusText.innerText = "Failed to connect to server.";
                statusText.style.color = "#f44336";
                isBetPlaced = false; 
            }
        }
    </script>
</body>
</html>
