<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Win Go</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; }
#admin-login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 5000; }
.login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 90%; max-width: 350px; text-align: center; }
.login-box h2 { color: #ff3e3e; margin-top: 0; margin-bottom: 5px; font-weight: 900; font-size: 24px; }
.login-input { width: 100%; box-sizing: border-box; padding: 14px; margin: 15px 0; border: 2px solid #eee; border-radius: 8px; font-size: 16px; outline: none; text-align: center; }
.login-input:focus { border-color: #ff3e3e; }
.login-btn { width: 100%; background: #ff3e3e; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
#admin-dashboard { display: none; padding: 20px; max-width: 1200px; margin: auto; }
.header { background: #ff3e3e; color: white; padding: 15px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
.header h2 { margin: 0; font-size: 20px; }
.action-btns { display: flex; gap: 10px; }
.btn-style { background: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
.refresh-btn { color: #ff3e3e; }
.logout-btn { color: #555; background: #f8f9fa; }
.tabs { display: flex; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; flex-wrap: wrap;}
.tab { flex: 1; text-align: center; padding: 12px; font-weight: bold; cursor: pointer; color: #555; background: #eee; font-size: 14px; min-width: 110px;}
.tab.active { background: #ff3e3e; color: white; }
.table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 800px; }
th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
th { background-color: #f8f9fa; color: #555; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
.card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
.card-dep { border-left: 5px solid #17b15e; }
.card-with { border-left: 5px solid #ff9800; }
.details { line-height: 1.6; font-size: 14px; }
.details span { font-weight: bold; color: #333; }
.btn-group { display: flex; gap: 10px; margin-top: 15px; }
.btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; font-size: 13px; }
.btn-approve { background: #17b15e; }
.btn-reject { background: #ff2a2a; }
.control-panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; max-width: 500px; margin: 0 auto;}
.control-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 20px 0; }
.color-btn { padding: 15px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
.bg-green { background-color: #17b15e; }
.bg-violet { background-color: #9c27b0; }
.bg-red { background-color: #ff2a2a; }
</style>
</head>
<body>

<div id="admin-login-screen">
<div class="login-box">
<h2>👑 Admin Login</h2>
<input type="text" id="admin-id" class="login-input" placeholder="Admin ID">
<input type="password" id="admin-pass" class="login-input" placeholder="Password">
<button class="login-btn" onclick="loginAdmin()">LOGIN TO DASHBOARD</button>
</div>
</div>

<div id="admin-dashboard">
<div class="header">
<h2><i class="fas fa-user-shield"></i> Win Go Admin</h2>
<div class="action-btns">
<button class="btn-style refresh-btn" onclick="manualRefresh()">🔄 Refresh</button>
<button class="btn-style logout-btn" onclick="logoutAdmin()">🚪 Logout</button>
</div>
</div>

<div class="tabs">
<div class="tab active" id="tab-users" onclick="switchTab('users')"><i class="fas fa-users"></i> Users</div>
<div class="tab" id="tab-dep" onclick="switchTab('dep')"><i class="fas fa-arrow-down"></i> Deposits</div>
<div class="tab" id="tab-with" onclick="switchTab('with')"><i class="fas fa-arrow-up"></i> Withdrawals</div>
<div class="tab" id="tab-game" onclick="switchTab('game')"><i class="fas fa-gamepad"></i> Game Control</div>
</div>

<div id="users-section" class="table-container">
<table>
<thead><tr><th>User ID</th><th>Mobile No.</th><th>Main Balance</th><th>Bonus Balance</th></tr></thead>
<tbody id="user-table-body"></tbody>
</table>
</div>

<div id="deposit-section" class="card-grid" style="display: none;"></div>
<div id="withdraw-section" class="card-grid" style="display: none;"></div>

<div id="game-section" style="display: none;">
    <div class="control-panel">
        <h2 style="margin-top: 0; color: #333;"><i class="fas fa-magic"></i> Set Next Result</h2>
        <p style="color: #666; font-size: 14px;">Select the color you want to win in the upcoming round.</p>
        
        <div class="control-grid">
            <button class="color-btn bg-green" onclick="forceResult('Green', 1)">Force Green (1)</button>
            <button class="color-btn bg-violet" onclick="forceResult('Violet', 0)">Force Violet (0)</button>
            <button class="color-btn bg-red" onclick="forceResult('Red', 2)">Force Red (2)</button>
        </div>
        
        <div style="background: #e3f2fd; color: #0b5394; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 20px;" id="force-status">
            Current Status: Random (No forced result)
        </div>
    </div>
</div>

</div>

<script>
const BACKEND_URL = "https://game-backend-1-fgug.onrender.com"; 
let refreshInterval;

function loginAdmin() {
    let id = document.getElementById("admin-id").value;
    let pass = document.getElementById("admin-pass").value;
    if(id === "New_admin" && pass === "h2VMUsM7a3W39J4E") {
        sessionStorage.setItem("admin_logged_in", "true");
        showDashboard();
    } else { alert("❌ Invalid Admin ID or Password!"); }
}

function logoutAdmin() {
    sessionStorage.removeItem("admin_logged_in");
    clearInterval(refreshInterval);
    document.getElementById("admin-login-screen").style.display = "flex";
    document.getElementById("admin-dashboard").style.display = "none";
}

function showDashboard() {
    document.getElementById("admin-login-screen").style.display = "none";
    document.getElementById("admin-dashboard").style.display = "block";
    switchTab('users'); 
    refreshInterval = setInterval(manualRefresh, 5000);
}

window.onload = () => { if(sessionStorage.getItem("admin_logged_in") === "true") showDashboard(); };

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('users-section').style.display = 'none';
    document.getElementById('deposit-section').style.display = 'none';
    document.getElementById('withdraw-section').style.display = 'none';
    document.getElementById('game-section').style.display = 'none';

    document.getElementById(`tab-${tab}`).classList.add('active');
    
    if(tab === 'users') { document.getElementById('users-section').style.display = 'block'; fetchUsers(); }
    else if(tab === 'dep') { document.getElementById('deposit-section').style.display = 'grid'; fetchDeposits(); }
    else if(tab === 'with') { document.getElementById('withdraw-section').style.display = 'grid'; fetchWithdrawals(); }
    else if(tab === 'game') { document.getElementById('game-section').style.display = 'block'; }
}

function manualRefresh() {
    if(document.getElementById('tab-users').classList.contains('active')) fetchUsers();
    else if(document.getElementById('tab-dep').classList.contains('active')) fetchDeposits();
    else if(document.getElementById('tab-with').classList.contains('active')) fetchWithdrawals();
}

async function fetchUsers() {
    try {
        let res = await fetch(`${BACKEND_URL}/admin/users`);
        let data = await res.json();
        let html = "";
        data.users.forEach(user => {
            html += `<tr><td>${user.uniqueId}</td><td><b>${user.mobile}</b></td><td style="color:#17b15e;">₹${(user.mainBalance||0).toFixed(2)}</td><td style="color:#ff9800;">₹${(user.bonusBalance||0).toFixed(2)}</td></tr>`;
        });
        document.getElementById("user-table-body").innerHTML = html || "<tr><td colspan='4'>No users</td></tr>";
    } catch(e) {}
}

async function fetchDeposits() {
    try {
        let res = await fetch(`${BACKEND_URL}/admin/pending-deposits`); 
        let data = await res.json(); 
        let html = data.requests.length === 0 ? '<p style="text-align:center;">No pending deposits</p>' : ''; 
        data.requests.forEach(req => { 
            html += `<div class="card card-dep"><div class="details">Mobile: ${req.mobile}<br>Amt: ₹${req.amount}<br>UTR: ${req.utr}</div>
            <div class="btn-group"><button class="btn btn-approve" onclick="processReq('deposit','${req.id}','approve')">Approve</button>
            <button class="btn btn-reject" onclick="processReq('deposit','${req.id}','reject')">Reject</button></div></div>`;
        });
        document.getElementById('deposit-section').innerHTML = html;
    } catch(e) {}
}

async function fetchWithdrawals() {
    try {
        let res = await fetch(`${BACKEND_URL}/admin/pending-withdrawals`); 
        let data = await res.json(); 
        let html = data.requests.length === 0 ? '<p style="text-align:center;">No pending withdrawals</p>' : ''; 
        data.requests.forEach(req => { 
            html += `<div class="card card-with"><div class="details">Mobile: ${req.mobile}<br>Amt: ₹${req.amount}<br>UPI: ${req.upiId}</div>
            <div class="btn-group"><button class="btn btn-approve" onclick="processReq('withdraw','${req.id}','approve')">Approve</button>
            <button class="btn btn-reject" onclick="processReq('withdraw','${req.id}','reject')">Reject</button></div></div>`;
        });
        document.getElementById('withdraw-section').innerHTML = html;
    } catch(e) {}
}

async function processReq(type, id, action) {
    if(!confirm(`Proceed with ${action}?`)) return; 
    let endpoint = type === 'deposit' ? '/admin/approve-deposit' : '/admin/approve-withdraw'; 
    try { 
        let res = await fetch(BACKEND_URL + endpoint, { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ requestId: id, action: action }) 
        }); 
        let data = await res.json(); 
        alert(`✅ ${data.message}`); 
        manualRefresh(); 
    } catch(e) { alert('❌ Server Error'); }
}

async function forceResult(color, number) {
    if(!confirm(`Are you sure you want to make ${color} win the next round?`)) return;
    try {
        let res = await fetch(`${BACKEND_URL}/admin/set-game-result`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ color: color, number: number })
        });
        let data = await res.json();
        if(data.success) {
            document.getElementById("force-status").innerHTML = `✅ Fixed Next Winner: <span style="color:red;">${color}</span>.`;
        }
    } catch(e) {
        alert("Failed to connect to server!");
    }
}
</script>
</body>
</html>
