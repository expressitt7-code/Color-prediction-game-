<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Win Go</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 20px; color: #ff3e3e; }
        .tabs { display: flex; margin-bottom: 15px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .tab { flex: 1; text-align: center; padding: 12px; font-weight: bold; cursor: pointer; color: #555; background: #eee; transition: 0.3s;}
        .tab.active { background: #ff3e3e; color: white; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-dep { border-left: 5px solid #17b15e; }
        .card-with { border-left: 5px solid #ff9800; }
        .details { line-height: 1.6; }
        .details span { font-weight: bold; color: #333; }
        .highlight { font-weight: bold; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; }
        .btn-approve { background: #17b15e; }
        .btn-reject { background: #ff2a2a; }
    </style>
</head>
<body>

<div class="header">
    <h2><i class="fas fa-user-shield"></i> Admin Panel</h2>
</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab active" id="tab-dep" onclick="switchTab('dep')">Deposits</div>
    <div class="tab" id="tab-with" onclick="switchTab('with')">Withdrawals</div>
</div>

<!-- DEPOSIT SECTION -->
<div id="deposit-section"></div>

<!-- WITHDRAW SECTION -->
<div id="withdraw-section" style="display: none;"></div>

<script>
    // APKA BACKEND URL
    const BACKEND_URL = "https://game-backend-1-fgug.onrender.com";

    function switchTab(tab) {
        document.getElementById('tab-dep').classList.remove('active');
        document.getElementById('tab-with').classList.remove('active');
        document.getElementById('deposit-section').style.display = 'none';
        document.getElementById('withdraw-section').style.display = 'none';
        
        if(tab === 'dep') {
            document.getElementById('tab-dep').classList.add('active');
            document.getElementById('deposit-section').style.display = 'block';
            fetchDeposits();
        } else {
            document.getElementById('tab-with').classList.add('active');
            document.getElementById('withdraw-section').style.display = 'block';
            fetchWithdrawals();
        }
    }

    async function fetchDeposits() {
        try {
            let res = await fetch(`${BACKEND_URL}/admin/pending-deposits`);
            let data = await res.json();
            let html = data.requests.length === 0 ? '<p style="text-align:center; color:#888;">No pending deposits</p>' : '';
            data.requests.forEach(req => {
                html += `
                <div class="card card-dep">
                    <div class="details">
                        User ID: <span>${req.telegramId}</span><br>
                        Amount: <span style="color:#17b15e;">₹${req.amount}</span><br>
                        UTR: <span class="highlight" style="color:#d32020;">${req.utr}</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-approve" onclick="processReq('deposit', '${req.id}', 'approve')"><i class="fas fa-check"></i> Approve</button>
                        <button class="btn btn-reject" onclick="processReq('deposit', '${req.id}', 'reject')"><i class="fas fa-times"></i> Reject</button>
                    </div>
                </div>`;
            });
            document.getElementById('deposit-section').innerHTML = html;
        } catch(e) {}
    }

    async function fetchWithdrawals() {
        try {
            let res = await fetch(`${BACKEND_URL}/admin/pending-withdrawals`);
            let data = await res.json();
            let html = data.requests.length === 0 ? '<p style="text-align:center; color:#888;">No pending withdrawals</p>' : '';
            data.requests.forEach(req => {
                html += `
                <div class="card card-with">
                    <div class="details">
                        User ID: <span>${req.telegramId}</span><br>
                        Amount to Pay: <span class="highlight" style="color:#ff9800; font-size:18px;">₹${req.amount}</span><br>
                        Send to UPI: <span class="highlight" style="color:#2196f3; user-select:all;">${req.upiId}</span>
                    </div>
                    <p style="font-size:12px; color:#888; margin-top:8px;">*Pehle is UPI par ₹${req.amount} bhejein, uske baad Approve dabayein.</p>
                    <div class="btn-group">
                        <button class="btn btn-approve" onclick="processReq('withdraw', '${req.id}', 'approve')">Paid & Approve</button>
                        <button class="btn btn-reject" onclick="processReq('withdraw', '${req.id}', 'reject')">Reject & Refund</button>
                    </div>
                </div>`;
            });
            document.getElementById('withdraw-section').innerHTML = html;
        } catch(e) {}
    }

    async function processReq(type, id, action) {
        if(!confirm(`Are you sure you want to ${action} this request?`)) return;
        let endpoint = type === 'deposit' ? '/admin/approve-deposit' : '/admin/approve-withdraw';
        try {
            let res = await fetch(BACKEND_URL + endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ requestId: id, action: action })
            });
            let data = await res.json();
            alert(`✅ ${data.message}`);
            type === 'deposit' ? fetchDeposits() : fetchWithdrawals();
        } catch(e) { alert('❌ Server Error'); }
    }

    // Auto-refresh data every 5 seconds
    fetchDeposits();
    setInterval(() => {
        if(document.getElementById('tab-dep').classList.contains('active')) fetchDeposits();
        else fetchWithdrawals();
    }, 5000);
</script>
</body>
</html>
