<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Win Go</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { background: #333; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; font-size: 24px; font-weight: bold; }
        .container { display: flex; flex-direction: column; gap: 20px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card h2 { margin-top: 0; color: #444; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; }
        .btn { padding: 8px 12px; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; margin: 2px; }
        .btn-approve { background-color: #17b15e; }
        .btn-reject { background-color: #ff2a2a; }
        .btn:hover { opacity: 0.8; }
        .empty-msg { text-align: center; color: #888; padding: 20px; font-style: italic; }
        
        /* Live Status Box Style */
        .live-status { background: #e3f2fd; border-left: 5px solid #2196f3; text-align: center; padding: 15px; }
        .live-status h3 { margin: 0 0 10px 0; color: #1976d2; }
        .stat-box { display: inline-block; background: white; padding: 10px 20px; border-radius: 8px; font-size: 18px; margin: 0 10px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .stat-box span { color: #ff3e3e; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">⚙️ Win Go - Admin Control Panel</div>
        
        <!-- NEW: LIVE GAME STATUS -->
        <div class="card live-status">
            <h3>⏱️ Live Game Status</h3>
            <div>
                <div class="stat-box">Current Period: <span id="admin-period">Loading...</span></div>
                <div class="stat-box">Time Left: <span id="admin-time">--</span>s</div>
            </div>
        </div>

        <!-- Deposits Section -->
        <div class="card">
            <h2>📥 Pending Deposits</h2>
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Amount</th>
                        <th>UTR Number</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="deposit-body">
                    <tr><td colspan="4" class="empty-msg">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Withdrawals Section -->
        <div class="card">
            <h2>📤 Pending Withdrawals</h2>
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Amount</th>
                        <th>UPI ID</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="withdraw-body">
                    <tr><td colspan="4" class="empty-msg">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://game-backend-1-fgug.onrender.com";

        // Fetch Live Game Status (Period & Time)
        function fetchLiveStatus() {
            fetch(`${BACKEND_URL}/game-status`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('admin-period').innerText = data.period;
                    document.getElementById('admin-time').innerText = data.time;
                })
                .catch(err => console.log("Error loading live status"));
        }

        // Fetch and display Deposits
        async function loadDeposits() {
            try {
                let res = await fetch(`${BACKEND_URL}/admin/pending-deposits`);
                let data = await res.json();
                let html = "";
                
                if (data.requests.length === 0) {
                    html = '<tr><td colspan="4" class="empty-msg">No pending deposits found.</td></tr>';
                } else {
                    data.requests.forEach(r => {
                        html += `<tr>
                            <td><b>${r.telegramId}</b></td>
                            <td style="color: green; font-weight: bold;">₹${r.amount}</td>
                            <td>${r.utr}</td>
                            <td>
                                <button class="btn btn-approve" onclick="handleDeposit('${r.id}', 'approve')">Approve</button>
                                <button class="btn btn-reject" onclick="handleDeposit('${r.id}', 'reject')">Reject</button>
                            </td>
                        </tr>`;
                    });
                }
                document.getElementById('deposit-body').innerHTML = html;
            } catch (e) { console.log("Error loading deposits"); }
        }

        // Fetch and display Withdrawals
        async function loadWithdrawals() {
            try {
                let res = await fetch(`${BACKEND_URL}/admin/pending-withdrawals`);
                let data = await res.json();
                let html = "";
                
                if (data.requests.length === 0) {
                    html = '<tr><td colspan="4" class="empty-msg">No pending withdrawals found.</td></tr>';
                } else {
                    data.requests.forEach(r => {
                        html += `<tr>
                            <td><b>${r.telegramId}</b></td>
                            <td style="color: red; font-weight: bold;">₹${r.amount}</td>
                            <td>${r.upiId}</td>
                            <td>
                                <button class="btn btn-approve" onclick="handleWithdraw('${r.id}', 'approve')">Approve</button>
                                <button class="btn btn-reject" onclick="handleWithdraw('${r.id}', 'reject')">Reject</button>
                            </td>
                        </tr>`;
                    });
                }
                document.getElementById('withdraw-body').innerHTML = html;
            } catch (e) { console.log("Error loading withdrawals"); }
        }

        // Action Functions
        async function handleDeposit(id, action) {
            if(!confirm(`Are you sure you want to ${action} this deposit?`)) return;
            
            await fetch(`${BACKEND_URL}/admin/approve-deposit`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ requestId: id, action: action })
            });
            alert(`Deposit ${action}d successfully!`);
            loadDeposits(); // Refresh list
        }

        async function handleWithdraw(id, action) {
            if(!confirm(`Are you sure you want to ${action} this withdrawal?`)) return;

            await fetch(`${BACKEND_URL}/admin/approve-withdraw`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ requestId: id, action: action })
            });
            alert(`Withdrawal ${action}d successfully!`);
            loadWithdrawals(); // Refresh list
        }

        // Initialize and setup intervals
        fetchLiveStatus();
        loadDeposits();
        loadWithdrawals();

        // Update timer every 1 second
        setInterval(fetchLiveStatus, 1000);
        // Refresh requests every 10 seconds
        setInterval(() => {
            loadDeposits();
            loadWithdrawals();
        }, 10000);
    </script>
</body>
</html>
